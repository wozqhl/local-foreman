[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "local-foreman"
version = "0.1.0"
description = "Mac-first local agent: Qwen3-8B works, remote coach only guides"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Shaffer Wang"}]
dependencies = []

[project.optional-dependencies]
mlx = ["mlx-lm"]

[project.scripts]
local-foreman = "local_foreman.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
